name: Build Windows

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/HermesDesktop.WinUI/HermesDesktop.WinUI.csproj

      - name: Build
        id: build
        continue-on-error: true
        run: dotnet build src/HermesDesktop.WinUI/HermesDesktop.WinUI.csproj -c Release --no-restore

      - name: Dump XAML errors
        if: steps.build.outcome == 'failure'
        run: |
          Write-Host "=== XAML Compiler output.json ==="
          $outputJson = Get-ChildItem -Path src/HermesDesktop.WinUI/obj -Recurse -Filter "output.json" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($outputJson) {
            Get-Content $outputJson.FullName -Raw
          } else {
            Write-Host "No output.json found"
          }
          
          Write-Host "=== input.json ==="
          $inputJson = Get-ChildItem -Path src/HermesDesktop.WinUI/obj -Recurse -Filter "input.json" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($inputJson) {
            Get-Content $inputJson.FullName -Raw | Select-Object -First 100
          }
        shell: pwsh
