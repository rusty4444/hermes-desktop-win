name: Build Windows

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/HermesDesktop.WinUI/HermesDesktop.WinUI.csproj

      - name: Build XAML only (generate input.json)
        run: dotnet build src/HermesDesktop.WinUI/HermesDesktop.WinUI.csproj -c Release --no-restore -t:MarkupCompilePass1 -v detailed 2>&1 | Select-Object -Last 500
        continue-on-error: true
        shell: pwsh

      - name: Read XAML compiler output
        run: |
          Write-Host "=== Searching for output.json ==="
          $files = Get-ChildItem -Path src/HermesDesktop.WinUI/obj -Recurse -Filter "*.json" -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            Write-Host "`n=== $($f.FullName) ==="
            try { Get-Content $f.FullName -Raw -ErrorAction Stop | Select-Object -First 500 } catch { Write-Host "(binary or unreadable)" }
          }
        shell: pwsh

      - name: Full Build
        run: dotnet build src/HermesDesktop.WinUI/HermesDesktop.WinUI.csproj -c Release --no-restore

      - name: Publish
        if: success()
        run: dotnet publish src/HermesDesktop.WinUI/HermesDesktop.WinUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HermesDesktop.WinUI
          path: publish/

      - name: Upload to Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/HermesDesktop.WinUI.exe
