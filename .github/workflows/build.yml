name: Build Windows

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/HermesDesktop.WinUI/HermesDesktop.WinUI.csproj

      - name: Build
        id: build
        run: |
          $result = dotnet build src/HermesDesktop.WinUI/HermesDesktop.WinUI.csproj -c Release --no-restore -v detailed 2>&1
          $result | Out-File -FilePath build-detailed.log -Encoding utf8
          # Extract XAML-specific errors
          Write-Host "=== XAML Errors ==="
          $result | Select-String -Pattern "XamlCompiler|error XM|error MC|error XC|error VAL|MarkupComp" -SimpleMatch | ForEach-Object { $_.Line }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed with exit code $LASTEXITCODE"
            exit 1
          }
        shell: pwsh

      - name: Publish
        if: success()
        run: dotnet publish src/HermesDesktop.WinUI/HermesDesktop.WinUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HermesDesktop.WinUI
          path: publish/

      - name: Upload to Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/HermesDesktop.WinUI.exe
