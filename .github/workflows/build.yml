name: Build Windows

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/HermesDesktop.WinUI/HermesDesktop.WinUI.csproj

      - name: Build
        id: build
        continue-on-error: true
        run: |
          dotnet build src/HermesDesktop.WinUI/HermesDesktop.WinUI.csproj -c Release --no-restore -v normal 2>&1 > build.log
          $exitCode = $LASTEXITCODE
          Write-Host "=== build.log (last 200 lines) ==="
          Get-Content build.log | Select-Object -Last 200
          exit $exitCode
        shell: pwsh

      - name: Publish
        if: steps.build.outcome == 'success'
        run: dotnet publish src/HermesDesktop.WinUI/HermesDesktop.WinUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: HermesDesktop.WinUI
          path: publish/

      - name: Upload to Release
        if: steps.build.outcome == 'success' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/HermesDesktop.WinUI.exe
